<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>은빛 늑대 용병단</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="guild">
        <div id="guild-name" class="guild-name">용병단</div>
        <div id="day" class="day"></div>
      </div>
      <div class="resources">
        <div class="res" title="금화"><span id="gold-icon"></span><span id="gold">0</span></div>
        <div class="res" title="명성"><span id="rep-icon"></span><span id="rep">0</span></div>
        <div class="res rank-box" title="용병단 등급">
          <span id="rank" class="rank">F</span>
          <div class="rank-prog">
            <div class="bar thin"><div id="rank-bar" class="bar-fill f-exp"></div></div>
            <span id="rank-next" class="small muted"></span>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <button id="menu-btn" class="btn small">메뉴</button>
        <button id="next-day" class="btn primary">다음 날 ▶</button>
      </div>
    </header>

    <div class="scene-wrap">
      <canvas id="scene"></canvas>
    </div>
    <div id="ticker" class="ticker"></div>

    <nav class="tabs">
      <button class="tab" data-tab="roster">용병단</button>
      <button class="tab" data-tab="quests">의뢰 게시판 <span class="badge"></span></button>
      <button class="tab" data-tab="map">지도</button>
      <button class="tab" data-tab="tavern">주점 <span class="badge"></span></button>
      <button class="tab" data-tab="shop">상점</button>
      <button class="tab" data-tab="facilities">시설</button>
      <button class="tab" data-tab="log">일지</button>
    </nav>

    <main id="panel" class="panel"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-body"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/content.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
