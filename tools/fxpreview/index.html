<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 저장소 루트 기준으로 assets/, js/ 를 읽는다: python3 tools/serve.py 8000 → http://localhost:8000/tools/fxpreview/ -->
<base href="../../">
<title>FX Preview</title>
<style>
  :root { --bg: #14151c; --panel: #1d1f29; --ink: #e6e3da; --dim: #9a98a4; --line: #333646; --warn: #f0b25a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--dim); }
  main { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  #stageWrap { overflow: auto; max-width: 100%; }
  #stage { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #tl { display: block; width: 100%; height: 46px; margin-top: 6px; background: var(--panel); }
  aside { flex: 1 1 280px; max-width: 420px; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 12px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  button, select, input { font: inherit; color: var(--ink); background: #2a2d3a; border: 1px solid var(--line); padding: 3px 8px; }
  button.on { background: #4a3240; border-color: #b8323c; }
  input[type=range] { width: 100%; padding: 0; }
  input[type=number] { width: 80px; }
  label { color: var(--ink); }
  .ph { color: var(--warn); }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  #readout { color: var(--dim); }
  #notes li { margin-bottom: 3px; }
</style>
</head>
<body>
<header>
  <h1>FX preview — 바렌 「회전베기」 궁극기 파일럿 (sig/captain/blademaster/hoejeon-begi)</h1>
  <p>640×360 게임 배율 그대로, 정수 확대만. 스펙: <span class="mono">assets/fx/sig/captain/blademaster/hoejeon-begi.json</span> · 키트: <span class="mono">assets/fx/kits/captain/blademaster.json</span></p>
</header>
<main>
  <div>
    <div id="stageWrap"><canvas id="stage" width="640" height="360"></canvas></div>
    <canvas id="tl" width="640" height="46"></canvas>
    <div class="row mono" id="readout"></div>
  </div>
  <aside>
    <h2>재생</h2>
    <div class="row">
      <button id="play">일시정지</button>
      <button id="restart">처음부터</button>
      <button id="back">◀ 1프레임</button>
      <button id="fwd">1프레임 ▶</button>
      <label><input type="checkbox" id="loop" checked> 반복</label>
    </div>
    <div class="row">속도
      <button data-speed="0.25">0.25×</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
    </div>
    <div class="row"><input type="range" id="scrub" min="0" max="1000" value="0"></div>
    <h2>장면</h2>
    <div class="row">시드 <input type="number" id="seed" value="7"> <button id="reseed">다른 시드</button></div>
    <div class="row">확대 <button data-zoom="1">1×</button><button data-zoom="2" class="on">2×</button><button data-zoom="3">3×</button>
      배경 <select id="bg"></select></div>
    <div class="row"><label><input type="checkbox" id="anchors"> 앵커·표식 보기</label></div>
    <h2>레이어</h2>
    <div id="layers"></div>
    <h2>상태</h2>
    <ul id="notes"></ul>
  </aside>
</main>
<script src="js/art.js"></script>
<script src="js/fx/skel.js"></script>
<script src="js/fx/placeholders.js"></script>
<script src="js/fx/player.js"></script>
<script src="tools/fxpreview/preview.js"></script>
</body>
</html>
